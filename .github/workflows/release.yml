# Publicación de caustix en (Test)PyPI con Trusted Publishing (OIDC): sin tokens en el repositorio.
# Solo se ejecuta a mano (workflow_dispatch). El job `publish` usa un *environment* con aprobación
# manual: configúralo en GitHub (Settings > Environments) con revisores obligatorios.
name: release
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Destino de la publicación"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de desarrollo
        working-directory: python
        run: python -m pip install --upgrade pip && python -m pip install -e . --group dev
      - name: Pruebas
        working-directory: python
        run: python -m pytest -q
      - name: Verificar el empaquetado (AC-13, AC-22)
        working-directory: python
        run: python tools/check_dist.py
      - name: Exigir que la etiqueta vX.Y.Z coincida con __version__ (PyPI)
        if: ${{ inputs.target == 'pypi' }}
        working-directory: python
        run: |
          version="$(python -c 'import caustix; print(caustix.__version__)')"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "La etiqueta ${GITHUB_REF_NAME} no coincide con __version__ (v${version})" >&2
            exit 1
          fi
      - name: Construir sdist y wheel
        working-directory: python
        run: python -m build --outdir dist
      - name: Verificar los artefactos que se publican
        working-directory: python
        run: python -m twine check --strict dist/*
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: python/dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    # Requiere aprobación manual del environment elegido (testpypi o pypi).
    environment: ${{ inputs.target }}
    permissions:
      id-token: write # Trusted Publishing (OIDC)
    steps:
      - name: Exigir una etiqueta vX.Y.Z para publicar en PyPI real
        if: ${{ inputs.target == 'pypi' && !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          echo "Publicar en PyPI exige ejecutar el workflow sobre una etiqueta vX.Y.Z" >&2
          exit 1
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - name: Publicar en TestPyPI
        if: ${{ inputs.target == 'testpypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/
      - name: Publicar en PyPI
        if: ${{ inputs.target == 'pypi' }}
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # release/v1
        with:
          packages-dir: dist/
