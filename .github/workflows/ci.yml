name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: python

jobs:
  lint:
    name: Lint y tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de desarrollo
        run: python -m pip install --upgrade pip && python -m pip install -e . --group dev
      - name: ruff
        run: python -m ruff check .
      - name: mypy
        run: python -m mypy .

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Instalar dependencias de desarrollo
        run: python -m pip install --upgrade pip && python -m pip install -e . --group dev
      - name: pytest
        run: python -m pytest -q

  min-deps:
    name: Tests con NumPy mínimo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"
      - name: Instalar con NumPy 1.24
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . --group dev "numpy==1.24.*"
      - name: pytest
        run: python -m pytest -q

  package:
    name: Empaquetado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias de desarrollo
        run: python -m pip install --upgrade pip && python -m pip install -e . --group dev
      - name: Construir y verificar sdist y wheel
        run: python tools/check_dist.py

  reference-solver:
    name: Validador Fortran
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Instalar gfortran
        run: sudo apt-get update && sudo apt-get install -y gfortran
      - name: Comprobar que las fixtures coinciden con el solver
        working-directory: fortran
        run: python tools/regen.py --check
